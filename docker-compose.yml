version: "2"
services:
  docker-ps4-pkg-sender:
    build: .
    container_name: docker-ps4-pkg-sender
    environment:
      - PORT=3333
      - STATIC_FILES=/pkg_sender/files
      - LOCALIP=192.168.0.104
      - PS4IP=192.168.0.102
    restart: unless-stopped
    ports:
      - 3333:8080
    volumes:
      - /srv/PS4Unified:/app/files