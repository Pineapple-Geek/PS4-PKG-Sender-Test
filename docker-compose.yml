version: "2"
services:
  pkg_sender:
    build: .
    container_name: pkg_sender
    volumes:
      - /srv/PS4Unified:/pkg_sender/files
    ports:
      - 3333:3333
    environment:
      - PORT=3333
      - STATIC_FILES=/pkg_sender/files
      - LOCALIP=192.168.0.104
      - PS4IP=192.168.0.102
    restart: unless-stopped